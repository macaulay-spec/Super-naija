<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e14" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>IBADAN LIFE — 3D Nigerian Life Sim</title>
    <link rel="stylesheet" href="./src/ui/style.css" />
  <script src="https://sites.super.myninja.ai/_assets/ninja-daytona-script.js"></script>
</head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>

      <!-- Loading Screen -->
      <div id="loading-screen" class="screen">
        <div class="loading-inner">
          <div class="logo-mark">IL</div>
          <h1 class="game-title">IBADAN<span>LIFE</span></h1>
          <p class="tagline">Lagos is a place. Ibadan is a people.</p>
          <div class="load-bar"><div id="load-fill"></div></div>
          <div id="load-status" class="load-status">Booting engine…</div>
          <button id="enter-btn" class="btn-primary hidden">ENTER IBADAN</button>
        </div>
      </div>

      <!-- Character Setup -->
      <div id="setup-screen" class="screen hidden">
        <div class="panel setup-panel">
          <h2>Create Your Character</h2>
          <label class="field"><span>Name</span><input id="setup-name" maxlength="16" value="Player" /></label>
          <label class="field"><span>Skin Tone</span><input id="setup-skin" type="range" min="0" max="5" value="2" /></label>
          <label class="field"><span>Outfit Color</span><input id="setup-outfit" type="color" value="#e8b923" /></label>
          <label class="field"><span>Hairstyle</span>
            <select id="setup-hair">
              <option value="0">Low Cut</option>
              <option value="1">Afro</option>
              <option value="2">Braids</option>
              <option value="3">Cap</option>
            </select>
          </label>
          <button id="setup-start" class="btn-primary">START LIFE</button>
        </div>
      </div>

      <!-- HUD -->
      <div id="hud" class="hidden">
        <div class="hud-topleft">
          <div class="wallet"><span class="naira">₦</span><span id="hud-cash">0</span></div>
          <div class="identity"><span id="hud-name">Player</span><span id="hud-level" class="lvl">Lv 1</span></div>
          <div class="needs">
            <div class="need"><i class="ic-hunger">🍲</i><div class="bar"><div id="bar-hunger"></div></div></div>
            <div class="need"><i class="ic-energy">⚡</i><div class="bar"><div id="bar-energy"></div></div></div>
            <div class="need"><i class="ic-hygiene">🚿</i><div class="bar"><div id="bar-hygiene"></div></div></div>
          </div>
        </div>

        <div class="hud-topright">
          <canvas id="minimap" width="150" height="150"></canvas>
          <div id="conn-status" class="conn online">● Online</div>
        </div>

        <div id="interact-prompt" class="interact-prompt hidden"><span class="key">E</span><span id="interact-text">Interact</span></div>

        <div id="chat-log" class="chat-log"></div>

        <div id="mobile-controls" class="hidden">
          <div id="joystick-zone"><div id="joystick-base"><div id="joystick-knob"></div></div></div>
          <div id="action-buttons">
            <button id="btn-jump" class="abtn">⤒</button>
            <button id="btn-interact" class="abtn primary">✋</button>
            <button id="btn-sprint" class="abtn">»</button>
          </div>
          <div id="drive-controls" class="hidden">
            <button id="btn-brake" class="abtn">■</button>
            <button id="btn-exit" class="abtn">⏏</button>
          </div>
        </div>

        <div id="desktop-hint" class="desktop-hint">WASD move · Mouse look · Shift sprint · Space jump · E interact · P phone · M map</div>

        <div class="hud-actions">
          <button id="qa-phone" title="Phone">📱</button>
          <button id="qa-inventory" title="Inventory">🎒</button>
          <button id="qa-map" title="Map">🗺️</button>
          <button id="qa-settings" title="Settings">⚙️</button>
        </div>
      </div>

      <!-- Generic Modal -->
      <div id="modal" class="modal hidden">
        <div class="modal-panel">
          <div class="modal-head"><h3 id="modal-title">Panel</h3><button id="modal-close">✕</button></div>
          <div id="modal-body" class="modal-body"></div>
        </div>
      </div>

      <!-- Toast -->
      <div id="toast-wrap"></div>
    </div>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
